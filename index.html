<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be.Live — Organic · Community · Vitality</title>
  <meta name="description" content="Be.Live brings together organic living, community, and vitality for a healthier, more connected life." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient background orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <!-- Floating leaf particles -->
  <div class="particles" id="particles"></div>

  <!-- NAV -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <span class="nav-brand">Be<span class="dot">.</span>Live</span>
      <ul class="nav-links">
        <li><a href="#hero">Home</a></li>
        <li><a href="#philosophy" class="nav-cta">Our Philosophy</a></li>
      </ul>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero" id="hero">
    <div class="hero-content">

      <!-- Logo -->
      <div class="logo-wrapper" id="logo-wrapper">
        <div class="logo-glow-ring"></div>
        <img
          src="logo.jpg"
          alt="Be.Live logo — Organic, Community, Vitality"
          class="logo-img"
          id="main-logo"
        />
      </div>

      <!-- Tagline badges -->
      <div class="tagline-pills" id="tagline-pills">
        <span class="pill">🌿 Organic</span>
        <span class="pill-dot">•</span>
        <span class="pill">🤝 Community</span>
        <span class="pill-dot">•</span>
        <span class="pill">⚡ Vitality</span>
      </div>

      <!-- Scroll cue -->
      <div class="scroll-cue" id="scroll-cue">
        <span>Discover more</span>
        <div class="scroll-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12l7 7 7-7"/>
          </svg>
        </div>
      </div>

    </div>
  </section>

  <!-- PHILOSOPHY PLACEHOLDER -->
  <section class="philosophy" id="philosophy">
    <div class="philosophy-inner">
      <div class="coming-soon-badge">Coming Soon</div>
      <h2 class="philosophy-heading">Our Philosophy</h2>
      <p class="philosophy-sub">
        Something meaningful is taking shape here.<br/>
        <em>Check back soon.</em>
      </p>
      <div class="philosophy-divider">
        <span></span><span class="leaf-icon">🌿</span><span></span>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 <strong>Be.Live</strong> &nbsp;·&nbsp; Organic &nbsp;·&nbsp; Community &nbsp;·&nbsp; Vitality</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
